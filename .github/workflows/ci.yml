name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  unittest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.9', '3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run tests
        run: python3 -m unittest discover -s tests -v

      - name: Shipped receipts verify, tampered one does not
        env:
          MCP_GATE_KEY: mcp-gate-demo-key-not-a-secret
        run: |
          set -euo pipefail
          python3 mcp_gate.py verify-receipt demo/open-server.receipt.json
          python3 mcp_gate.py verify-receipt demo/compliant-server.receipt.json
          set +e
          python3 mcp_gate.py verify-receipt demo/tampered.receipt.json >/dev/null
          rc=$?
          set -e
          test "$rc" -eq 1 || { echo "tampered receipt must fail, got rc=$rc" >&2; exit 1; }

      - name: A non-URL target is refused
        run: |
          set -euo pipefail
          set +e
          python3 mcp_gate.py check ./mcp_gate.py >/dev/null 2>&1
          rc=$?
          set -e
          test "$rc" -eq 2 || { echo "expected exit 2, got $rc" >&2; exit 1; }
