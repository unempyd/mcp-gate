name: 'MCP Gate'
description: >
  Probe a deployed MCP endpoint and fail the build if it serves its tool list
  without authentication, or refuses without a usable RFC 9728 challenge.
  Emits a signed receipt of exactly what was observed.
branding:
  icon: 'shield'
  color: 'blue'
inputs:
  target:
    description: 'http(s) URL of the MCP endpoint to probe'
    required: true
  receipt-out:
    description: 'Optional receipt output path (default: mcp-gate-receipts/)'
    required: false
  gate-key:
    description: >
      HMAC key for receipt signing (use a repository secret). Receipts are only
      verifiable where the same key is present, so set this explicitly if you
      intend to verify them later; otherwise each run signs with a throwaway key.
    required: false
outputs:
  receipt:
    description: 'Path of the signed receipt JSON'
    value: ${{ steps.gate.outputs.receipt }}
  failures:
    description: 'Number of failing checks (0 = pass)'
    value: ${{ steps.gate.outputs.failures }}
runs:
  using: 'composite'
  steps:
    - id: gate
      shell: bash
      # Inputs reach the script only as environment variables. Interpolating
      # ${{ inputs.* }} into the script body would execute whatever a caller
      # derived them from (PR title, branch name, dispatch input).
      env:
        MCP_GATE_KEY: ${{ inputs.gate-key }}
        GATE_TARGET: ${{ inputs.target }}
        GATE_RECEIPT_OUT: ${{ inputs.receipt-out }}
      run: |
        set -euo pipefail
        ARGS=("$GATE_TARGET")
        if [ -n "$GATE_RECEIPT_OUT" ]; then ARGS+=(--receipt-out "$GATE_RECEIPT_OUT"); fi
        set +e
        python3 "$GITHUB_ACTION_PATH/mcp_gate.py" check "${ARGS[@]}" | tee mcp-gate-result.json
        GATE_RC=${PIPESTATUS[0]}
        set -e
        if [ "$GATE_RC" -eq 2 ]; then
          echo "mcp-gate: target error" >&2
          exit 2
        fi
        FAILURES=$(python3 -c "import json;print(json.load(open('mcp-gate-result.json'))['failures'])")
        RECEIPT=$(python3 -c "import json;print(json.load(open('mcp-gate-result.json'))['receipt'])")
        echo "failures=$FAILURES" >> "$GITHUB_OUTPUT"
        echo "receipt=$RECEIPT" >> "$GITHUB_OUTPUT"
        exit "$GATE_RC"
